<style>
:root{--navy:#0f1f47;--navy2:#1d3166;--verde:#7cc042;--verde-esc:#3f7d17;--azul:#008bcc;--teal:#1fb0c0;--amarelo:#f3c018;--laranja:#ea9823;

*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--texto);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;padding-bottom:96px;min-height:100vh}
a{color:var(--azul)}
.topo{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}

.topo .voltar{color:#fff;text-decoration:none;font-size:34px;line-height:1;width:32px;text-align:center}
.topo .simbolo{width:34px;height:34px;background:#fff;border-radius:8px;padding:3px}
.abas{display:flex;background:#fff;border-bottom:1px solid var(--linha);position:sticky;top:58px;z-index:4}
.abas a{flex:1;text-align:center;padding:12px 4px;text-decoration:none;color:var(--mudo);font-weight:600;font-size:14px;border-bottom:3px solid transparent}
.abas a.ativa{color:var(--navy);border-color:var(--verde)}
.capa{text-align:center;padding:28px 16px 8px;background:#fff;border-bottom:1px solid var(--linha)}
.capa img{width:220px;max-width:70%}.capa h2{margin:12px 0 4px;color:var(--navy)}.capa p{margin:0;color:var(--mudo)}
.bloco{padding:16px}.bloco h3{margin:4px 0 12px;color:var(--navy)}
.linha-titulo{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.linha-titulo h3{margin:0}
.sinc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}.sinc .botao{padding:8px 14px;font-size:14px}.sinc span{font-size:13px;flex:1;min-width:160px}
main>.sinc,#app>.sinc{margin:10px 16px}
.cartao{display:flex;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:14px 16px;margin-bottom:10px;text-decoration:none;color:var(--texto)}
.cartao strong{font-size:17px;color:var(--navy)}.cartao span{font-size:14px}

.botao{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 18px;border-radius:10px;border:0;background:var(--navy);color:#fff;font:600 16px system-ui,sans-serif;text-decoration:none;cursor:pointer}
.botao.secundario{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.botao.perigo{background:#fff;color:var(--erro);border:2px solid #f0c9c9;margin-top:24px}
.botao.largo{width:100%}.botao:disabled{opacity:.6}
.fixo{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--fundo) 30%);max-width:720px;margin:0 auto}
.fixo .botao{background:var(--verde-esc);font-size:18px;min-height:56px;box-shadow:0 4px 14px rgba(15,31,71,.25)}
.placar{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--linha);border-bottom:1px solid var(--linha)}
.placar div{background:#fff;text-align:center;padding:10px 4px}.placar b{display:block;font-size:20px;color:var(--navy)}.placar span{font-size:12px;color:var(--mudo)}
.placar .bom b,.bom{color:var(--verde-esc)}.placar .ruim b,.ruim{color:var(--erro)}
.nota{margin:12px 16px 0;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid var(--linha);font-size:14px}
.nota.bom{border-color:#b9dc9b;background:#f1f9ea}.nota.ruim{border-color:#f0c9c9;background:#fdf1f1}
.formulario label{display:block;font-weight:600;font-size:14px;margin:0 0 14px;color:var(--navy)}
.formulario input,.formulario select,.formulario textarea{display:block;width:100%;margin-top:6px;font:16px system-ui,sans-serif;padding:12px;border:1.5px solid #c5ccd8;border-radius:10px;background:#fff;color:var(--texto)}
.formulario input[hidden]{display:none}
.formulario input:focus,.formulario select:focus,.formulario textarea:focus{outline:3px solid #b6dcf2;border-color:var(--azul)}
.formulario small{display:block;font-weight:400;color:var(--mudo);margin-top:4px}
.formula{margin:-6px 0 16px;padding:10px 12px;background:#f1f6fb;border:1px solid #d7e3ef;border-radius:10px}
.formula .eq{font:600 15px ui-monospace,Menlo,monospace;color:var(--navy);overflow-wrap:anywhere}
.formula sup{font-size:11px}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:1.5px solid var(--linha);border-radius:var(--raio);margin:0 0 14px;padding:10px 12px;background:#fff}
legend{font-weight:700;color:var(--navy);padding:0 6px}
.opcao{display:flex!important;gap:10px;align-items:center;font-weight:500!important}.opcao input{width:auto!important;margin:0!important}
.acoes{margin-top:8px}.acoes.duas{display:grid;grid-template-columns:2fr 1fr;gap:10px}
details{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:10px 12px;margin-bottom:14px}
summary{font-weight:600;color:var(--azul);cursor:pointer}details[open] summary{margin-bottom:12px}
.num-arvore input{font-size:22px;font-weight:700;width:120px}
.campo-especie{position:relative}
.sugestoes{display:flex;flex-direction:column;margin:-8px 0 12px;border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.sugestoes button{text-align:left;border:0;border-bottom:1px solid var(--linha);background:#fff;padding:12px;font:16px system-ui,sans-serif;color:var(--texto)}
.sugestoes button small{display:block;color:var(--mudo)}.sugestoes .manual{color:var(--azul);font-weight:600}

.escolhida{font-size:15px;margin:-4px 0 12px;color:var(--navy)}
.fustes .cab-fustes,.fuste{display:grid;grid-template-columns:24px 1fr 56px 1fr 36px;gap:8px;align-items:center}
.cab-fustes{font-size:12px;color:var(--mudo);font-weight:600}
.fuste{margin-bottom:8px}.fuste input{margin:0!important;font-size:18px!important;text-align:center}
.fuste .dap{color:var(--mudo);text-align:center;font-size:14px}
.tirar{border:0;background:#f3f4f7;border-radius:8px;height:40px;font-size:22px;color:var(--mudo)}
.gps{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--linha);border-radius:var(--raio);padding:10px 12px;margin-bottom:14px}
.gps strong{display:block;font-size:14px;color:var(--navy)}.gps span{font-size:14px;color:var(--mudo)}
.fotos{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
#miniaturas{display:flex;gap:6px;flex-wrap:wrap}#miniaturas img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.fotos label.botao{margin:0;color:var(--navy)}
.formulario label.botao{color:#fff;font-size:16px;margin-top:4px}.formulario label.botao.secundario{color:var(--navy)}
.avisos p{margin:0 0 8px;padding:10px 12px;border-radius:10px;font-size:14px}
.avisos .erro{background:#fdecec;color:var(--erro);font-weight:600}
.avisos .aviso{background:var(--aviso-fundo);color:var(--aviso)}
.avisos .info{background:#e8f4fb;color:#0a5b85}
.lista-arvores{padding-top:8px}
.arvore{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--linha);border-left:5px solid var(--verde);border-radius:var(--raio);padding:12px;margin-bottom:8px;text-decoration:none;color:var(--texto)}
.arvore.com-aviso{border-left-color:var(--laranja)}
.arvore .num{min-width:44px;height:44px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.arvore .corpo{display:flex;flex-direction:column;flex:1;min-width:0;font-size:14px}
.arvore strong{font-size:16px;color:var(--navy)}.arvore .medidas{color:var(--mudo)}
.sem-nome{color:var(--aviso)}
.icone-aviso{width:28px;height:28px;border-radius:50%;background:var(--laranja);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.tabela{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--raio);overflow:hidden;font-size:14px}
.tabela td,.tabela th{padding:9px 10px;border-bottom:1px solid var(--linha);text-align:left}
.tabela td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tabela.larga td:not(:first-child),.tabela.larga th:not(:first-child){text-align:right}
.tabela th{background:var(--navy);color:#fff;font-weight:600}
.rolar{overflow-x:auto}
.curva{display:flex;gap:6px;align-items:flex-end;height:140px;background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:12px 12px 4px}
.curva div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.curva span{display:block;width:100%;background:var(--teal);border-radius:4px 4px 0 0}
.curva small{font-size:11px;color:var(--mudo)}
.rodape{padding:16px;text-align:center;font-size:13px;color:var(--mudo)}
.alerta{color:var(--erro);font-weight:600}
#faixas{position:relative;z-index:20;max-width:720px;margin:0 auto}#faixas:empty{display:none}
.faixa{margin:0;padding:10px 16px;font-size:14px;border-bottom:1px solid var(--linha)}.faixa.ruim{background:#c62828;color:#fff}.faixa.ruim a{color:#fff}.faixa.aviso{background:var(--aviso-fundo);color:var(--aviso)}
.copia-dia{margin:0 0 12px;font-size:14px}.copia-dia.ruim{font-weight:600}
.vista{display:flex;gap:8px;margin:12px 16px 0}.vista button{flex:1;min-height:40px;border-radius:10px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font:600 14px system-ui,sans-serif}.vista button.ativa{background:var(--navy);color:#fff}
.tabela-arvores tr[data-ir]{cursor:pointer}.tabela.larga.tabela-arvores td:nth-child(3),.tabela.larga.tabela-arvores th:nth-child(3){text-align:left}.tabela-arvores td:nth-child(2),.tabela-arvores th:nth-child(2){text-align:center!important}.tabela-arvores tr.com-aviso td:first-child{border-left:4px solid var(--laranja)}

.importar{margin-top:10px}
.recentes .chip{font-style:normal}

.fotos-ident{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.ver-foto{flex:none;border:0;padding:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mudo)}

.form-ident{margin-top:6px}.form-ident label{margin-bottom:8px}.form-ident [data-msg]:empty{display:none}
.arvs-ident{display:flex;flex-direction:column}.arvs-ident a{padding:10px 0;border-bottom:1px solid var(--linha);color:var(--azul);font-size:14px}

.lista-fotos{display:flex;flex-direction:column;gap:8px}.foto-item{display:flex;gap:12px;background:#fff;border:1px solid var(--linha);border-left:5px solid var(--teal);border-radius:var(--raio);padding:10px;font-size:14px}
.foto-item.com-aviso{border-left-color:var(--erro)}.foto-item img{width:72px;height:72px;object-fit:cover;border-radius:8px;background:#e9edf3}.foto-item div{display:flex;flex-direction:column}.foto-item strong{color:var(--navy)}
.exportar .botao{margin-top:8px}.exportar .mudo{margin:6px 0 14px}.nota ul{margin:6px 0;padding-left:20px}
.abas a{font-size:13px;padding:12px 2px}
.dialogo{position:fixed;inset:0;background:rgba(15,31,71,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.dialogo .caixa{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%}.dialogo p{margin:0 0 16px;font-size:16px}
.dialogo .botoes{display:flex;gap:10px;justify-content:flex-end}.botao.perigo-cheio{background:var(--erro)}
.bloco .nota{margin:12px 0 0}
.tabela.larga{font-size:13px}.tabela.larga td,.tabela.larga th{padding:8px 6px}
.mapa{position:relative;height:58vh;min-height:320px;background:#eef1ea;border-bottom:1px solid var(--linha);overflow:hidden}
.mapa canvas{display:block;touch-action:none}
.mapa-botoes{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
.mapa-botoes button{width:44px;height:44px;border-radius:10px;border:1px solid var(--linha);background:#fff;font:700 22px system-ui,sans-serif;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.mapa-botoes .eu{color:var(--azul)}
.mapa-norte{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.85);border-radius:8px;padding:4px 8px;font:700 12px/1.1 system-ui,sans-serif;text-align:center;color:var(--navy)}
.mapa-escala{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.85);border-radius:6px;padding:4px 8px;font-size:12px;display:flex;align-items:center;gap:6px}
.mapa-escala span{display:block;height:6px;border:2px solid var(--navy);border-top:0}
.estado-gps{margin:0;padding:10px 16px;background:#fff;border-bottom:1px solid var(--linha);font-size:15px}
.estado-gps.bom{background:#f1f9ea;color:var(--verde-esc)}.estado-gps.ruim{background:#fdf1f1;color:var(--erro)}
.toque{position:relative;margin:12px 16px 0;padding:12px;background:#fff;border:1.5px solid var(--azul);border-radius:var(--raio);font-size:14px}
.toque p{margin:4px 0}.toque .item{border-top:1px solid var(--linha);padding:8px 0}.toque .item p{white-space:pre-line;color:var(--texto)}
.toque .item .botao{min-height:40px;margin-top:6px;font-size:14px}
.toque .fechar{position:absolute;right:6px;top:4px;border:0;background:none;font-size:26px;color:var(--mudo)}
.cartao.ponto{border-left:5px solid var(--amarelo)}.cartao.ponto.feito{border-left-color:var(--verde)}.cartao .dist{font-size:13px;color:var(--azul)}
.arquivos p{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:14px;gap:8px}.arquivos .tirar{width:40px;flex:none}
.instrucao{margin:0 0 12px;white-space:normal}
.avisos .especie{background:#f3e8fb;color:#5b2a86;font-weight:600}
.selo{display:inline-block;font:700 11px system-ui,sans-serif;color:#5b2a86;background:#f3e8fb;border-radius:6px;padding:1px 6px;font-style:normal;vertical-align:middle}
.cartao .bom,.cartao .ruim{font-size:13px;font-weight:600}
.abas a{font-size:12px}
</style>
