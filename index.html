<style>

a{color:var(--azul)}

.bloco{padding:16px}.bloco h3{margin:4px 0 12px;color:var(--navy)}
.linha-titulo{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.linha-titulo h3{margin:0}
.sinc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}.sinc .botao{padding:8px 14px;font-size:14px}.sinc span{font-size:13px;flex:1;min-width:160px}

.num-arvore input{font-size:22px;font-weight:700;width:120px}
.campo-especie{position:relative}

.avisos .info{background:#e8f4fb;color:#0a5b85}

.arvore strong{font-size:16px;color:var(--navy)}.arvore .medidas{color:var(--mudo)}
.sem-nome{color:var(--aviso)}
.icone-aviso{width:28px;height:28px;border-radius:50%;background:var(--laranja);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.tabela{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--raio);overflow:hidden;font-size:14px}
.tabela td,.tabela th{padding:9px 10px;border-bottom:1px solid var(--linha);text-align:left}
.tabela td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tabela.larga td:not(:first-child),.tabela.larga th:not(:first-child){text-align:right}
.tabela th{background:var(--navy);color:#fff;font-weight:600}
.rolar{overflow-x:auto}

.rodape{padding:16px;text-align:center;font-size:13px;color:var(--mudo)}
.alerta{color:var(--erro);font-weight:600}

.form-ident{margin-top:6px}.form-ident label{margin-bottom:8px}.form-ident [data-msg]:empty{display:none}
.arvs-ident{display:flex;flex-direction:column}.arvs-ident a{padding:10px 0;border-bottom:1px solid var(--linha);color:var(--azul);font-size:14px}

.abas a{font-size:13px;padding:12px 2px}

.tabela.larga{font-size:13px}.tabela.larga td,.tabela.larga th{padding:8px 6px}

.estado-gps{margin:0;padding:10px 16px;background:#fff;border-bottom:1px solid var(--linha);font-size:15px}
.estado-gps.bom{background:#f1f9ea;color:var(--verde-esc)}.estado-gps.ruim{background:#fdf1f1;color:var(--erro)}
.toque{position:relative;margin:12px 16px 0;padding:12px;background:#fff;border:1.5px solid var(--azul);border-radius:var(--raio);font-size:14px}

.cartao.ponto{border-left:5px solid var(--amarelo)}.cartao.ponto.feito{border-left-color:var(--verde)}.cartao .dist{font-size:13px;color:var(--azul)}
.arquivos p{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:14px;gap:8px}.arquivos .tirar{width:40px;flex:none}
.instrucao{margin:0 0 12px;white-space:normal}
.avisos .especie{background:#f3e8fb;color:#5b2a86;font-weight:600}
.selo{display:inline-block;font:700 11px system-ui,sans-serif;color:#5b2a86;background:#f3e8fb;border-radius:6px;padding:1px 6px;font-style:normal;vertical-align:middle}
.cartao .bom,.cartao .ruim{font-size:13px;font-weight:600}
.abas a{font-size:12px}
</style>
